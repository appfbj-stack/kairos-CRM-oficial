name: kairos-crm-prod

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kairos-crm-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
      WEB_ORIGIN: ${WEB_ORIGIN:-https://crm.fbautomacao.space}
      LOG_LEVEL: info
    networks:
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: kairos-crm-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://kairos-crm-api:4000}
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
