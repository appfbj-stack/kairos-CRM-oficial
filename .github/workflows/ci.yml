name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @kairos-crm/shared build
          pnpm --filter @kairos-crm/database build

      - name: Typecheck API
        run: pnpm --filter @kairos-crm/api run typecheck

      - name: Typecheck Web
        run: pnpm --filter @kairos-crm/web run typecheck

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t kairos-crm-api:ci .
      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t kairos-crm-web:ci .
