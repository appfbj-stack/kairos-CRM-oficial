name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TURBO_TELEMETRY_DISABLED: 1
  NODE_VERSION: 20

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (api)
        run: pnpm --filter @kairos-crm/api run lint || echo "lint script not defined - skip"

      - name: Lint (web)
        run: pnpm --filter @kairos-crm/web run lint || echo "lint script not defined - skip"

  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @kairos-crm/shared build
          pnpm --filter @kairos-crm/database build

      - name: Typecheck API
        run: pnpm --filter @kairos-crm/api run typecheck

      - name: Typecheck Web
        run: pnpm --filter @kairos-crm/web run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @kairos-crm/shared build
          pnpm --filter @kairos-crm/database build

      - name: Run API unit tests
        env:
          KAIROS_API_MASTER_KEY: ci_test_master_key_must_be_32_chars_long_xxxxxxxxxxxxx
          NODE_ENV: test
        run: pnpm --filter @kairos-crm/api test:run

  openapi-validate:
    name: OpenAPI spec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate OpenAPI YAML (syntax)
        run: |
          node -e "
            const fs = require('fs');
            const yaml = require('js-yaml');
            const content = fs.readFileSync('docs/external-api/openapi.yaml', 'utf8');
            const doc = yaml.load(content);
            if (!doc.openapi) throw new Error('Missing openapi version');
            if (!doc.paths || Object.keys(doc.paths).length === 0) throw new Error('No paths');
            if (!doc.components || !doc.components.schemas) throw new Error('No schemas');
            console.log('OpenAPI', doc.openapi, '- paths:', Object.keys(doc.paths).length, '- schemas:', Object.keys(doc.components.schemas).length);
          "

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t kairos-crm-api:ci .
      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t kairos-crm-web:ci .

  build:
    name: Build all packages
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm turbo run build --filter='@kairos-crm/*'
